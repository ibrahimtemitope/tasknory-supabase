    <script>
      // Mobile menu functionality - SIMPLE FIXED VERSION
// Mobile menu functionality - IMPROVED VERSION
document.addEventListener("DOMContentLoaded", function () {
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const sidebar = document.getElementById("sidebar");
    
    if (mobileMenuBtn && sidebar) {
        mobileMenuBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            sidebar.classList.toggle("mobile-open");
            mobileMenuBtn.classList.toggle("active");
        });

        // Close sidebar when clicking outside
        document.addEventListener("click", function (e) {
            if (sidebar.classList.contains("mobile-open")) {
                // Check if click is outside sidebar AND not on mobile menu button
                if (!sidebar.contains(e.target) && e.target !== mobileMenuBtn && !mobileMenuBtn.contains(e.target)) {
                    sidebar.classList.remove("mobile-open");
                    mobileMenuBtn.classList.remove("active");
                }
            }
        });

        // Prevent sidebar clicks from closing the sidebar
        sidebar.addEventListener("click", function (e) {
            e.stopPropagation();
        });

        // Close sidebar when clicking on nav links
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                sidebar.classList.remove("mobile-open");
                mobileMenuBtn.classList.remove("active");
            });
        });
    }
});
