<body>
  <div class="login-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to your freelancer account</p>
      </div>
      
      <form id="freelancerLoginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="your.email@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="submit-btn">
          <span>Sign In</span>
        </button>
      </form>

      <!-- Add this near the login form -->
<div style="text-align: center; margin-top: 1rem;">
    <a href="../auth/forgot-password.html" style="color: #2563eb; text-decoration: none; font-size: 0.875rem;">
        Forgot your password?
    </a>
</div>
      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html" class="auth-link">Sign up here</a></p>

    </div>
