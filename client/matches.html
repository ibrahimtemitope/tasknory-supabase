      /* ┌─────────────────────────────────────────────────┐
   │              MATCHES BADGES STYLING             │
   └─────────────────────────────────────────────────┘ */

/* Badge Container in Matches */
.freelancer-badges {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin: var(--space-2) 0;
  align-items: center;
}

/* Base Badge Styles for Matches */
.freelancer-badges .badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-md);
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border: 2px solid transparent;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.freelancer-badges .badge::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s ease;
}

.freelancer-badges .badge:hover::before {
  left: 100%;
}

/* Priority Levels - Highest to Lowest */

/* 1. LADDER BADGE (Highest Priority) */
.freelancer-badges .badge.ladder {
  background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
  color: #000000 !important;
  border-color: #FFA500;
  box-shadow: 0 4px 12px rgba(255, 165, 0, 0.3);
  padding: var(--space-1) var(--space-3);
  position: relative;
  -webkit-text-fill-color: #000000 !important;
}



/* 2. Tasknory CHOICE (High Priority) */
.freelancer-badges .badge.choice {
  background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
  color: white;
  border-color: #60A5FA;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.freelancer-badges .badge.choice::before {
  content: '⭐';
  margin-right: var(--space-1);
  font-size: 0.7rem;
}

/* 3. Tasknory PARTNER (Medium-High Priority) */
.freelancer-badges .badge.partner {
  background: linear-gradient(135deg, #10B981 0%, #047857 100%);
  color: white;
  border-color: #34D399;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

.freelancer-badges .badge.partner::before {
  content: '🤝';
  margin-right: var(--space-1);
  font-size: 0.7rem;
}

/* 4. VERIFIED SKILL BADGE (In matched skills list) */
.matched-skills .badge.verified {
  background: linear-gradient(135deg, #10B981 0%, #047857 100%);
  color: white;
  border: none;
  font-size: 0.6rem;
  padding: 1px 6px;
  margin-left: var(--space-2);
  border-radius: var(--radius-sm);
  font-weight: 600;
}

.matched-skills .badge.verified::before {
  content: '✓';
  margin-right: 2px;
  font-size: 0.5rem;
}

/* Badge Animation on Load */
@keyframes badgePop {
  0% {
    transform: scale(0.8);
    opacity: 0;
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.freelancer-badges .badge {
  animation: badgePop 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Stagger animations for multiple badges */
.freelancer-badges .badge:nth-child(1) { animation-delay: 0.1s; }
.freelancer-badges .badge:nth-child(2) { animation-delay: 0.2s; }
.freelancer-badges .badge:nth-child(3) { animation-delay: 0.3s; }

/* Responsive Badge Layout */
@media (max-width: 768px) {
  .freelancer-badges {
    gap: var(--space-1);
  }
  
  .freelancer-badges .badge {
    font-size: 0.65rem;
    padding: 2px 8px;
  }
  
  .freelancer-badges .badge.ladder {
    font-size: 0.6rem;
    padding: 2px 8px;
  }
  
  .matched-skills .badge.verified {
    font-size: 0.55rem;
    padding: 1px 4px;
  }
}

/* Light Theme Adjustments */
[data-theme="light"] .freelancer-badges .badge:not(.ladder):not(.choice):not(.partner):not(.verified) {
  background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
  color: #475569;
  border-color: #CBD5E1;
}

    <script>
      // Mobile menu functionality
      document.addEventListener("DOMContentLoaded", function () {
  const mobileMenuBtn = document.getElementById("mobileMenuBtn");
  const sidebar = document.getElementById("sidebar");
  const mainWrapper = document.getElementById("mainWrapper");

  if (mobileMenuBtn && sidebar) {
    mobileMenuBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      sidebar.classList.toggle("mobile-open");
      mobileMenuBtn.classList.toggle("active");
    });

    // Close sidebar when clicking outside
    document.addEventListener("click", function (e) {
      if (sidebar.classList.contains("mobile-open")) {
        // Check if click is outside sidebar AND not on mobile menu button
        if (!sidebar.contains(e.target) && e.target !== mobileMenuBtn && !mobileMenuBtn.contains(e.target)) {
          sidebar.classList.remove("mobile-open");
          mobileMenuBtn.classList.remove("active");
        }
      }
    });

    // Prevent sidebar clicks from closing the sidebar
    sidebar.addEventListener("click", function (e) {
      e.stopPropagation();
    });

    // Close sidebar when clicking on nav links (optional)
    document.querySelectorAll(".nav-link").forEach((link) => {
      link.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
        mobileMenuBtn.classList.remove("active");
      });
    });
  }
});
