<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Inbox</title>
    <link rel="stylesheet" href="../assets/css/admin.css" />
    <link rel="icon" href="../tasknory.jpg">
  </head>
  <body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h1 class="logo">Admin</h1>
      </div>
      <!-- Add this right after .sidebar-head -->
      <div class="theme-toggle-container">
        <button
          id="themeToggle"
          class="theme-toggle-btn"
          aria-label="Toggle theme"
        >
          <span class="theme-icon">🌙</span>
          <span class="theme-label">Dark Mode</span>
        </button>
      </div>

      <ul class="nav-links">
            <li><a href="dashboard.html" class="nav-link"><span class="label">Dashboard</span></a></li>
            <li><a href="admin-skills.html" class="nav-link"><span class="label">Skill Verifications</span></a></li>
            <li><a href="support-issues.html" class="nav-link active"><span class="label">Support Inbox</span></a></li>
            <li><a href="withdrawal.html" class="nav-link"><span class="label">Withdrawal Processing</span></a></li>
            <li class="nav-footer"><a href="login.html" class="nav-link logout"><span class="icon">🚪</span><span class="label">Logout</span></a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper" id="mainWrapper">
      <header class="top-header">
        <button
          class="mobile-menu-btn"
          id="mobileMenuBtn"
          aria-label="Toggle menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="header-content">
          <h1>Support Inbox</h1>
        </div>
      </header>

      <div class="admin-container">
        <main>
        <div class="admin-container">
            <div class="admin-header">
                <h1>Support Ticket Management</h1>
                <p>Manage all client and freelancer support requests</p>
            </div>

            <div class="alert" id="alertMessage"></div>

            <!-- Statistics -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-number">0</div>
                    <div class="stat-label">New Tickets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">0</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">0</div>
                    <div class="stat-label">Awaiting Response</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">0</div>
                    <div class="stat-label">Resolved</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-section">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label class="filter-label">Status</label>
                        <select class="filter-select" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="new">New</option>
                            <option value="in_progress">In Progress</option>
                            <option value="awaiting_response">Awaiting Response</option>
                            <option value="resolved">Resolved</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">User Type</label>
                        <select class="filter-select" id="userTypeFilter">
                            <option value="">All Users</option>
                            <option value="freelancer">Freelancer</option>
                            <option value="client">Client</option>
                            <option value="guest">Guest</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Category</label>
                        <select class="filter-select" id="categoryFilter">
                            <option value="">All Categories</option>
                            <!-- Categories will be populated dynamically -->
                        </select>
                    </div>
                    <div class="filter-group">
                        <button class="action-btn btn-primary" onclick="loadTickets()">Apply Filters</button>
                        <button class="action-btn btn-secondary" onclick="clearFilters()">Clear Filters</button>
                    </div>
                </div>
            </div>

            <!-- Tickets List -->
            <div class="tickets-list" id="ticketsList">
                <div class="empty-state">
                    <p>Loading tickets...</p>
                </div>
            </div>
        </div>
    </main>
      </div>
    </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
        <script type="module">
    import { apiRequest } from '../assets/js/api.js';
    import { CONTACT_CATEGORIES } from '../assets/js/contact-shared.js';

    let allTickets = [];

    document.addEventListener('DOMContentLoaded', async function() {
        await checkAdminAccess();
        await initializeFilters();
        await loadTickets();
        // Real-time updates not implemented in Django; you could use WebSocket but omit for now
    });

    async function checkAdminAccess() {
        try {
            const user = await apiRequest('/api/user/me/');
            if (user.role !== 'admin') {
                window.location.href = '../client/login.html';
            }
        } catch (error) {
            window.location.href = '../client/login.html';
        }
    }

    async function initializeFilters() {
        const categoryFilter = document.getElementById('categoryFilter');
        const allCategories = [...CONTACT_CATEGORIES.freelancer, ...CONTACT_CATEGORIES.client];
        const uniqueCategories = [...new Map(allCategories.map(item => [item.value, item])).values()];
        
        uniqueCategories.forEach(category => {
            const option = document.createElement('option');
            option.value = category.value;
            option.textContent = category.label;
            categoryFilter.appendChild(option);
        });
    }

    async function loadTickets() {
        const statusFilter = document.getElementById('statusFilter').value;
        const userTypeFilter = document.getElementById('userTypeFilter').value;
        const categoryFilter = document.getElementById('categoryFilter').value;

        // Build query string
        const params = new URLSearchParams();
        if (statusFilter) params.append('status', statusFilter);
        if (userTypeFilter) params.append('user_type', userTypeFilter);
        if (categoryFilter) params.append('category', categoryFilter);

        const url = `/api/admin/contact/${params.toString() ? '?' + params.toString() : ''}`;

        try {
            const data = await apiRequest(url);
            allTickets = data || [];
            renderTickets();
            updateStats();
        } catch (error) {
            console.error('Error loading tickets:', error);
            showAlert('Error loading tickets', 'error');
        }
    }

    function renderTickets() {
        const ticketsList = document.getElementById('ticketsList');

        if (allTickets.length === 0) {
            ticketsList.innerHTML = `
                <div class="empty-state">
                    <p>No tickets found</p>
                    <p>Try changing your filters</p>
                </div>
            `;
            return;
        }

        ticketsList.innerHTML = allTickets.map(ticket => `
            <div class="ticket-card" data-ticket-id="${ticket.id}">
                <div class="ticket-header">
                    <h3 class="ticket-subject">${escapeHtml(ticket.subject)}</h3>
                    <div class="ticket-meta">
                        <span class="user-type-badge">${escapeHtml(ticket.user_type)}</span>
                        <span class="status-badge status-${ticket.status}">${ticket.status.replace('_', ' ')}</span>
                        <span>${new Date(ticket.created_at).toLocaleDateString()}</span>
                    </div>
                </div>
                
                <div class="ticket-content">
                    <div class="ticket-message">
                        <strong>From:</strong> ${escapeHtml(ticket.name)} (${escapeHtml(ticket.email)})<br>
                        <strong>Category:</strong> ${getCategoryLabel(ticket.category)}<br><br>
                        ${escapeHtml(ticket.message)}
                    </div>

                    ${ticket.admin_response ? `
                        <div class="response-section">
                            <strong>Your Response:</strong>
                            <p>${escapeHtml(ticket.admin_response)}</p>
                            <small>Responded on ${new Date(ticket.admin_responded_at).toLocaleString()}</small>
                        </div>
                    ` : ''}

                    ${ticket.user_follow_up ? `
                        <div class="response-section">
                            <strong>User Follow-up:</strong>
                            <p>${escapeHtml(ticket.user_follow_up)}</p>
                            <small>Sent on ${new Date(ticket.user_follow_up_at).toLocaleString()}</small>
                        </div>
                    ` : ''}
                </div>

                <div class="ticket-actions">
                    ${ticket.status !== 'resolved' ? `
                        <button class="action-btn btn-primary" onclick="openResponseForm('${ticket.id}')">
                            ${ticket.admin_response ? 'Update Response' : 'Respond'}
                        </button>
                        
                        ${!ticket.allow_user_response ? `
                            <button class="action-btn btn-warning" onclick="enableUserResponse('${ticket.id}')">
                                Request More Info
                            </button>
                        ` : ''}
                        
                        <button class="action-btn btn-success" onclick="markAsResolved('${ticket.id}')">
                            Mark Resolved
                        </button>
                    ` : `
                        <button class="action-btn btn-secondary" onclick="reopenTicket('${ticket.id}')">
                            Reopen
                        </button>
                    `}
                </div>

                <div class="response-form" id="responseForm-${ticket.id}">
                    <div class="form-group">
                        <label class="form-label">Your Response</label>
                        <textarea class="form-textarea" id="responseText-${ticket.id}" placeholder="Type your response here...">${ticket.admin_response || ''}</textarea>
                    </div>
                    <div class="form-actions">
                        <button class="action-btn btn-primary" onclick="submitResponse('${ticket.id}')">Send Response</button>
                        <button class="action-btn btn-secondary" onclick="closeResponseForm('${ticket.id}')">Cancel</button>
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="allowResponse-${ticket.id}" ${ticket.allow_user_response ? 'checked' : ''}>
                            Allow user to respond
                        </label>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function getCategoryLabel(categoryValue) {
        const allCategories = [...CONTACT_CATEGORIES.freelancer, ...CONTACT_CATEGORIES.client];
        const category = allCategories.find(cat => cat.value === categoryValue);
        return category ? category.label : categoryValue;
    }

    function updateStats() {
        const stats = {
            new: allTickets.filter(t => t.status === 'new').length,
            in_progress: allTickets.filter(t => t.status === 'in_progress').length,
            awaiting_response: allTickets.filter(t => t.status === 'awaiting_response').length,
            resolved: allTickets.filter(t => t.status === 'resolved').length
        };

        document.querySelectorAll('.stat-card').forEach(card => {
            const label = card.querySelector('.stat-label').textContent.toLowerCase();
            const numberElement = card.querySelector('.stat-number');
            
            if (label.includes('new')) numberElement.textContent = stats.new;
            else if (label.includes('progress')) numberElement.textContent = stats.in_progress;
            else if (label.includes('awaiting')) numberElement.textContent = stats.awaiting_response;
            else if (label.includes('resolved')) numberElement.textContent = stats.resolved;
        });
    }

    function openResponseForm(ticketId) {
        document.querySelectorAll('.response-form').forEach(form => form.style.display = 'none');
        const form = document.getElementById(`responseForm-${ticketId}`);
        form.style.display = 'block';
    }

    function closeResponseForm(ticketId) {
        const form = document.getElementById(`responseForm-${ticketId}`);
        form.style.display = 'none';
    }

    async function submitResponse(ticketId) {
        const responseText = document.getElementById(`responseText-${ticketId}`).value.trim();
        const allowResponse = document.getElementById(`allowResponse-${ticketId}`).checked;

        if (!responseText) {
            showAlert('Please enter a response', 'error');
            return;
        }

        try {
            await apiRequest(`/api/admin/contact/${ticketId}/respond/`, {
                method: 'POST',
                body: JSON.stringify({ response: responseText })
            });
            // Note: The backend sets allow_user_response = True automatically.
            // If we want to control it, we'd need a separate endpoint. For now,
            // we trust the backend's behavior (always allows user response after admin reply).
            // If you need to control the checkbox, you'd need to extend the backend.
            showAlert('Response sent successfully!', 'success');
            closeResponseForm(ticketId);
            await loadTickets();
        } catch (error) {
            console.error('Error submitting response:', error);
            showAlert('Error sending response', 'error');
        }
    }

    async function enableUserResponse(ticketId) {
        try {
            await apiRequest(`/api/admin/contact/${ticketId}/enable-user-response/`, {
                method: 'POST'
            });
            showAlert('User can now respond to this ticket', 'success');
            await loadTickets();
        } catch (error) {
            console.error('Error enabling user response:', error);
            showAlert('Error updating ticket', 'error');
        }
    }

    async function markAsResolved(ticketId) {
        try {
            await apiRequest(`/api/admin/contact/${ticketId}/resolve/`, {
                method: 'POST'
            });
            showAlert('Ticket marked as resolved', 'success');
            await loadTickets();
        } catch (error) {
            console.error('Error resolving ticket:', error);
            showAlert('Error updating ticket', 'error');
        }
    }

    async function reopenTicket(ticketId) {
        try {
            await apiRequest(`/api/admin/contact/${ticketId}/reopen/`, {
                method: 'POST'
            });
            showAlert('Ticket reopened', 'success');
            await loadTickets();
        } catch (error) {
            console.error('Error reopening ticket:', error);
            showAlert('Error updating ticket', 'error');
        }
    }

    function clearFilters() {
        document.getElementById('statusFilter').value = '';
        document.getElementById('userTypeFilter').value = '';
        document.getElementById('categoryFilter').value = '';
        loadTickets();
    }

    function showAlert(message, type) {
        const alertMessage = document.getElementById('alertMessage');
        alertMessage.textContent = message;
        alertMessage.className = `alert alert-${type}`;
        alertMessage.style.display = 'block';

        setTimeout(() => {
            alertMessage.style.display = 'none';
        }, 5000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Make functions global for onclick handlers
    window.loadTickets = loadTickets;
    window.clearFilters = clearFilters;
    window.openResponseForm = openResponseForm;
    window.closeResponseForm = closeResponseForm;
    window.submitResponse = submitResponse;
    window.enableUserResponse = enableUserResponse;
    window.markAsResolved = markAsResolved;
    window.reopenTicket = reopenTicket;
</script>
    <script src="../assets/js/admin-ui.js" type="module"></script>
    <script src="../assets/js/admin.js" type="module"></script>
  </body>
</html>
